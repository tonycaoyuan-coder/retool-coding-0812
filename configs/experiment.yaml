version: 1
experiment:
  name: retool-coding-0812
  seed: 42
  base_model: Qwen/Qwen3.5-4B
  lora_rank: 32

inputs:
  formal_data_dir: inputs/formal-v6
  data_manifest: inputs/formal-v6/manifest.json
  shared_sft_source_manifest: ../07-retool-lcb-mini/artifacts/training/shared-cold-start/source/manifest.json
  calibration_gate: inputs/calibration-gate.json
  selected_protocol: inputs/protocol-selected.yaml
  docker_preflight: inputs/docker-image.json

shared_sft:
  epochs: 3
  learning_rate: 1.0e-5
  beta1: 0.9
  beta2: 0.95
  max_context_tokens: 12288
  max_micro_batch_items: 8
  max_micro_batch_padded_tokens: 65536
  save_every: 20

grpo:
  variants: [c0, c1, c2]
  steps: 100
  questions_per_step: 4
  group_size: 8
  temperature: 1.0
  top_p: 1.0
  learning_rate: 4.0e-5
  beta1: 0.9
  beta2: 0.95
  max_micro_batch_items: 16
  max_micro_batch_padded_tokens: 65536
  save_every: 20
  max_step_retries: 2
  early_gate_step: 20
  min_nondegenerate_group_rate: 0.50
  max_skipped_update_rate: 0.25

protocol:
  name: P1
  max_tool_calls: 1
  max_assistant_turns: 2
  max_assistant_tokens: 10240
  max_trajectory_tokens: 20480
  max_tool_response_tokens: 512

docker:
  # Resolve Docker from PATH so the frozen experiment is portable across hosts.
  binary: docker
  image: retool-lcb-mini-sandbox:py311
  workers: 4
  tool_timeout_seconds: 5
  case_timeout_seconds: 3
  judge_timeout_seconds: 30

checkpoint_dev:
  tasks: 100
  checkpoints: [20, 40, 60, 80, 100]
  prompts: [c0, c1, c2]
  selection_order: [average_pass_at_1, worst_pass_at_1, case_pass_rate, earlier_checkpoint]

evaluation:
  tasks: 200
  prompts: [c0, c1, c2]
  temperature: 0.0
  top_p: 1.0
  top_k: -1
  n: 1
  pass_k: [1]
  max_concurrency: 4
  timeout_seconds: 300
  retries: 2
  retry_base_seconds: 1
  bootstrap_samples: 10000
  confidence_level: 0.95

swanlab:
  enabled: true
  mode: online
  project: retool-coding-0812
  group: retool-coding-0812-seed42
